# Render Blueprint — https://render.com/docs/blueprint-spec
# Push this file to your repo's root; Render auto-detects it and offers
# one-click "Deploy to Render".

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  - name: subtrack-db
    databaseName: subtrack
    user: subtrack
    plan: free
    ipAllowList: []

services:
  # ── Unified Web App (Next.js Frontend + FastAPI Backend) ─────────────
  - name: subtrack-web
    type: web
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: subtrack
      - key: APP_TITLE
        value: Subtrack
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: subtrack-db
          property: connectionString
      - key: PORT
        value: 3000
    healthCheckPath: /api/v1/health